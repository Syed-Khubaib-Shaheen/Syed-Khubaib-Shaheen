name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake in empty contribution cells
        env:
          PROFILE_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from xml.sax.saxutils import escape
          
          query = """query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount contributionLevel weekday } } } } } }"""
          request = Request("https://api.github.com/graphql", data=json.dumps({"query": query, "variables": {"login": os.environ["PROFILE_USER"]}}).encode(), headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json", "User-Agent": "profile-contribution-orbit"})
          with urlopen(request, timeout=60) as response:
              data = json.load(response)
          if data.get("errors"):
              raise RuntimeError("GitHub contribution query failed")
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
          levels = {"NONE": 0, "FIRST_QUARTILE": 1, "SECOND_QUARTILE": 2, "THIRD_QUARTILE": 3, "FOURTH_QUARTILE": 4}
          Path("dist").mkdir(exist_ok=True)
          for theme, colors in [("", ["#ebedf0", "#ddd6fe", "#a78bfa", "#8b5cf6", "#6d28d9"]), ("-dark", ["#161b22", "#312e81", "#4338ca", "#6d28d9", "#a78bfa"])]:
              width = 64 + 14 * len(weeks)
              empty = {(column, day["weekday"]) for column, week in enumerate(weeks) for day in week["contributionDays"] if day["contributionCount"] == 0}
              def neighbors(cell):
                  x, y = cell
                  return [(x+dx, y+dy) for dx,dy in [(1,0),(0,1),(-1,0),(0,-1)] if (x+dx,y+dy) in empty]
              remaining = set(empty)
              components = []
              while remaining:
                  first = min(remaining)
                  component, pending = {first}, [first]
                  remaining.remove(first)
                  while pending:
                      for adjacent in neighbors(pending.pop()):
                          if adjacent in remaining:
                              remaining.remove(adjacent)
                              component.add(adjacent)
                              pending.append(adjacent)
                  components.append(component)
              route = []
              if components:
                  component = max(components, key=len)
                  first = min(component)
                  visited, route = {first}, [first]
                  stack = [(first, iter(neighbors(first)))]
                  while stack:
                      cell, choices = stack[-1]
                      adjacent = next(choices, None)
                      if adjacent is None:
                          stack.pop()
                          if stack:
                              route.append(stack[-1][0])
                      elif adjacent not in visited:
                          visited.add(adjacent)
                          route.append(adjacent)
                          stack.append((adjacent, iter(neighbors(adjacent))))
              path = " ".join(("M" if index == 0 else "L") + f" {37+x*14} {37+y*14}" for index,(x,y) in enumerate(route))
              parts = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} 164" role="img"><title>Contribution grid with a purple snake moving through empty cells</title>']
              for column, week in enumerate(weeks):
                  for day in week["contributionDays"]:
                      x, y = 32 + column * 14, 32 + day["weekday"] * 14
                      color = colors[levels[day["contributionLevel"]]]
                      label = escape(f'{day["date"]}: {day["contributionCount"]} contributions')
                      parts.append(f'<rect x="{x}" y="{y}" width="10" height="10" rx="2" fill="{color}"><title>{label}</title></rect>')
              length = max((len(route) - 1) * 14, 14)
              duration = max(length / 120, 3)
              delay = 14 / length * duration
              for segment in (range(min(4, max(len(route)-1, 1))-1, -1, -1) if route else []):
                  begin = -duration + segment * delay
                  color = "#c4b5fd" if segment == 0 else "#8b5cf6"
                  parts.append(f'<g><animateMotion path="{path}" dur="{duration}s" begin="{begin:.6f}s" repeatCount="indefinite" rotate="auto"/><rect x="-4" y="-4" width="8" height="8" rx="2" fill="{color}"/>')
                  if segment == 0:
                      parts.append('<circle cx="2" cy="-2" r="1" fill="#312e81"/><circle cx="2" cy="2" r="1" fill="#312e81"/>')
                  parts.append('</g>')
              parts.append('</svg>')
              Path(f"dist/github-snake{theme}.svg").write_text("".join(parts))
          PYTHON
      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
